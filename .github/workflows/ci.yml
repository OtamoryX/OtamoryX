# OtamoryX CI/CD Pipeline
# Licensed under GPL-3.0 License - see LICENSE file for details
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io

jobs:
  # Auto-update SQLx offline query cache
  sqlx-prepare:
    name: SQLx Prepare Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Cargo dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          backend/target/
        key: ${{ runner.os }}-cargo-sqlx-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-sqlx-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev

    - name: Install sqlx-cli
      run: command -v sqlx || cargo install sqlx-cli --no-default-features --features sqlite

    - name: Create database with schema
      working-directory: backend
      run: |
        mkdir -p data
        sqlx database create --database-url sqlite:data/otamoryx.db
        sqlx migrate run --database-url sqlite:data/otamoryx.db --source migrations/sqlite

    - name: Check SQLx prepare status
      id: check
      working-directory: backend
      continue-on-error: true
      run: cargo sqlx prepare --check --database-url sqlite:data/otamoryx.db

    - name: Run SQLx prepare and commit
      if: steps.check.outcome == 'failure'
      working-directory: backend
      run: |
        cargo sqlx prepare --database-url sqlite:data/otamoryx.db
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .sqlx/
        git commit -m "chore: auto-update sqlx offline query cache [skip ci]"
        git push

  # Backend tests and linting
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'release'

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    
    - name: Cache Cargo dependencies
      uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          backend/target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('backend/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev
    
    - name: Check code formatting
      run: cd backend && cargo fmt --all -- --check
    
    - name: Run Clippy
      # Existing lint debt is tracked separately; keep reporting it without hiding test results.
      continue-on-error: true
      run: cd backend && cargo clippy --all-targets --all-features -- -D warnings
    
    - name: Run tests
      run: cd backend && cargo test --verbose
    
    - name: Check for security vulnerabilities
      run: |
        command -v cargo-audit || cargo install cargo-audit
        cd backend && cargo audit

  # Frontend tests and linting
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'release'

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1
    
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml
        
    - name: Install dependencies
      run: cd frontend && pnpm install --frozen-lockfile
    
    - name: Run linting
      # Existing lint debt is tracked separately; keep reporting it without hiding test results.
      continue-on-error: true
      run: cd frontend && pnpm run lint
    
    - name: Run type checking
      run: cd frontend && npx vue-tsc --noEmit
    
    - name: Run tests
      run: cd frontend && pnpm run test

  # Quick build and push for main branch (unstable) - Matrix strategy
  docker-build-unstable:
    name: Build Unstable Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    needs: [sqlx-prepare]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64

    steps:
    - name: Checkout repository (latest, including any sqlx-prepare commits)
      uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ${{ env.DOCKERHUB_REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Generate image names
      id: image-name
      run: |
        echo "ghcr=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        echo "dockerhub=goddai/$(echo ${{ github.repository }} | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Generate platform tag
      id: platform-tag
      run: |
        platform=${{ matrix.platform }}
        echo "tag=${platform//\//-}" >> $GITHUB_OUTPUT

    - name: Build and push unstable image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        outputs: type=image,name=${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }},push-by-digest=true,name-canonical=true,push=true
        cache-from: |
          type=gha,scope=unstable-${{ steps.platform-tag.outputs.tag }}
          type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}:buildcache-${{ steps.platform-tag.outputs.tag }}
        cache-to: |
          type=gha,scope=unstable-${{ steps.platform-tag.outputs.tag }},mode=max
          type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}:buildcache-${{ steps.platform-tag.outputs.tag }},mode=max
        provenance: false
        sbom: false
    
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
        
    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-unstable-${{ steps.platform-tag.outputs.tag }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
  
  # Merge unstable images into manifest
  docker-merge-unstable:
    name: Create Unstable Manifest
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [docker-build-unstable]
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-unstable-*
        merge-multiple: true
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ${{ env.DOCKERHUB_REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Generate image names
      id: image-name
      run: |
        echo "ghcr=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        echo "dockerhub=goddai/$(echo ${{ github.repository }} | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
        
    - name: Create manifest list and push to both registries
      working-directory: /tmp/digests
      run: |
        docker buildx imagetools create \
          -t ${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}:main-unstable-latest \
          -t ${{ env.DOCKERHUB_REGISTRY }}/${{ steps.image-name.outputs.dockerhub }}:main-unstable-latest \
          $(printf '${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}@sha256:%s ' *)

  # Build and push stable release after tests pass - Matrix strategy
  docker-build-release:
    name: Build Release Image (${{ matrix.platform }})
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [backend-test, frontend-test]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - linux/amd64
          # - linux/arm64
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ${{ env.DOCKERHUB_REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Generate image names
      id: image-name
      run: |
        echo "ghcr=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        echo "dockerhub=goddai/$(echo ${{ github.repository }} | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Generate platform tag
      id: platform-tag
      run: |
        platform=${{ matrix.platform }}
        echo "tag=${platform//\//-}" >> $GITHUB_OUTPUT

    - name: Build and push release image by digest
      id: build
      uses: docker/build-push-action@v6
      with:
        context: .
        platforms: ${{ matrix.platform }}
        push: true
        outputs: type=image,name=${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }},push-by-digest=true,name-canonical=true,push=true
        cache-from: |
          type=gha,scope=release-${{ steps.platform-tag.outputs.tag }}
          type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}:buildcache-${{ steps.platform-tag.outputs.tag }}
        cache-to: |
          type=gha,scope=release-${{ steps.platform-tag.outputs.tag }},mode=max
          type=registry,ref=${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}:buildcache-${{ steps.platform-tag.outputs.tag }},mode=max
        provenance: false
        sbom: false
    
    - name: Export digest
      run: |
        mkdir -p /tmp/digests
        digest="${{ steps.build.outputs.digest }}"
        touch "/tmp/digests/${digest#sha256:}"
        
    - name: Upload digest
      uses: actions/upload-artifact@v7
      with:
        name: digests-release-${{ steps.platform-tag.outputs.tag }}
        path: /tmp/digests/*
        if-no-files-found: error
        retention-days: 1
  
  # Merge release images into manifest
  docker-merge-release:
    name: Create Release Manifest
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [docker-build-release]
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: /tmp/digests
        pattern: digests-release-*
        merge-multiple: true
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.GHCR_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Log in to Docker Hub
      uses: docker/login-action@v4
      with:
        registry: ${{ env.DOCKERHUB_REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Generate image names
      id: image-name
      run: |
        echo "ghcr=${{ github.repository }}" | tr '[:upper:]' '[:lower:]' >> $GITHUB_OUTPUT
        echo "dockerhub=goddai/$(echo ${{ github.repository }} | cut -d'/' -f2 | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

    - name: Extract metadata for tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}
          ${{ env.DOCKERHUB_REGISTRY }}/${{ steps.image-name.outputs.dockerhub }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest
        
    - name: Create manifest list and push to both registries
      working-directory: /tmp/digests
      run: |
        tags="$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')"
        docker buildx imagetools create \
          $(printf -- "-t %s " $tags) \
          $(printf '${{ env.GHCR_REGISTRY }}/${{ steps.image-name.outputs.ghcr }}@sha256:%s ' *)

  # Build frontend once and share as artifact
  build-frontend:
    name: Build Frontend for Release
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    needs: [docker-merge-release]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '24'
        cache: 'pnpm'
        cache-dependency-path: frontend/pnpm-lock.yaml

    - name: Build frontend
      run: |
        cd frontend
        pnpm install --frozen-lockfile
        pnpm run build

    - name: Upload frontend dist
      uses: actions/upload-artifact@v7
      with:
        name: frontend-dist
        path: frontend/dist
        retention-days: 1

  # Create release artifacts
  release-artifacts:
    name: Create Release Artifacts
    runs-on: ${{ matrix.os }}
    if: github.event_name == 'release'
    needs: [build-frontend]
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu, x86_64-apple-darwin]
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install system dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config libssl-dev mingw-w64

    - name: Download frontend dist
      uses: actions/download-artifact@v8
      with:
        name: frontend-dist
        path: frontend/dist

    - name: Build backend
      run: |
        cd backend
        cargo build --release --target ${{ matrix.target }}

    - name: Create release archive
      run: |
        mkdir -p release
        cp backend/target/${{ matrix.target }}/release/otamoryx-server* release/
        cp -r frontend/dist release/public
        cd release
        if [[ "${{ matrix.target }}" == *"windows"* ]]; then
          zip -r otamoryx-${{ matrix.target }}.zip .
        else
          tar czf otamoryx-${{ matrix.target }}.tar.gz .
        fi

    - name: Upload release asset
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/otamoryx-${{ matrix.target }}.zip
          release/otamoryx-${{ matrix.target }}.tar.gz
        fail_on_unmatched_files: false

  # Cleanup untagged images from GHCR after successful builds
  cleanup-untagged:
    name: Cleanup Untagged Images
    runs-on: ubuntu-latest
    needs: [docker-merge-unstable, docker-merge-release]
    if: always() && (needs.docker-merge-unstable.result == 'success' || needs.docker-merge-release.result == 'success')
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Delete untagged container images
      uses: actions/delete-package-versions@v5
      with:
        package-name: ${{ github.repository }}
        package-type: container
        min-versions-to-keep: 5
        delete-only-untagged-versions: true
        token: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true
