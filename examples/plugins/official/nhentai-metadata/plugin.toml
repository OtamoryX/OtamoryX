[plugin]
id = "nhentai-metadata"
name = "nHentai Metadata"
version = "0.1.0"
manifest_version = 1
plugin_api_version = 1
type = "metadata"
description = "Fetch metadata from nHentai by source URL or automatically matched title."
author = "OtamoryX Team"
cooldown = 2
oneshot_arg = "nHentai URL or gallery id"

[plugin_dependencies]

[permissions]
network = ["nhentai.net"]
filesystem_read = []
filesystem_write = []
database_read = true
database_write = ["tags", "archive_tags", "plugin_tags"]
custom_endpoints = false
scheduled_tasks = false

[events]
subscribe = ["archive_added"]

[config_schema]
type = "object"
additional_properties = false
required = []
