[plugin]
id = "ehentai-metadata"
name = "E-Hentai Metadata"
version = "0.1.0"
manifest_version = 1
plugin_api_version = 1
type = "metadata"
description = "Fetch metadata from E-Hentai by source URL or automatically matched title."
author = "OtamoryX Team"
cooldown = 3
oneshot_arg = "E-Hentai gallery URL or gid/token pair"

[plugin_dependencies]

[permissions]
network = ["api.e-hentai.org", "e-hentai.org"]
filesystem_read = []
filesystem_write = []
database_read = true
database_write = ["tags", "archive_tags", "plugin_tags"]
custom_endpoints = false
scheduled_tasks = false

[events]
subscribe = ["archive_added"]

[config_schema]
type = "object"
additional_properties = false
required = []
