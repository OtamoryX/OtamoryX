[plugin]
name = "image-processor"
version = "1.0.0"
description = "Advanced image processing plugin for comic pages optimization and enhancement"
author = "OtamoryX Team"
entry_point = "src/main.rs"

[capabilities]
archive_processing = true
custom_endpoint = true
scheduled_task = true

[permissions]
network = false
filesystem_read = ["/tmp/otamoryx/extract/*", "/tmp/otamoryx/cache/*"]
filesystem_write = ["/tmp/otamoryx/processed/*"]
database_read = true
database_write = ["archives", "processing_jobs"]
custom_endpoints = true
scheduled_tasks = true

[dependencies]
image = "0.24"
imageproc = "0.23"
rayon = "1.8"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }
axum = "0.7"
uuid = "1.6"
chrono = { version = "0.4", features = ["serde"] }

[config_schema]
processing_modes = { type = "array", items = "string", default = ["optimize", "enhance"] }
output_format = { type = "string", default = "webp" }
quality_settings = { 
  type = "object", 
  default = { 
    "webp_quality": 85, 
    "jpeg_quality": 90,
    "png_compression": 6,
    "max_width": 2048,
    "max_height": 2048
  } 
}
batch_size = { type = "number", default = 10 }
auto_process = { type = "boolean", default = false }
enhancement_settings = {
  type = "object",
  default = {
    "sharpen": true,
    "noise_reduction": true,
    "contrast_adjust": true,
    "brightness_adjust": false
  }
}