[package]
name = "otamoryx-server"
version = "0.1.0"
edition = "2021"
authors = ["OtamoryX Contributors"]
description = "OtamoryX digital comic/manga reader and management platform - Backend server"
homepage = "https://github.com/your-username/OtamoryX"
repository = "https://github.com/your-username/OtamoryX"
license = "GPL-3.0"
keywords = ["comic", "manga", "reader", "library", "self-hosted"]
categories = ["multimedia", "web-programming"]

[dependencies]
axum = { version = "0.8.4", features = ["macros"] }           # Web框架
tokio = { version = "1.45", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
sqlx = { version = "0.8", features = [
    "runtime-tokio-rustls",
    "sqlite",
    "chrono",
    "uuid",
] }

# 时间处理
chrono = { version = "0.4.41", features = ["serde"] }

# UUID生成
uuid = { version = "1.0", features = ["v4", "serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["json"] }

# 配置管理
config = "0.15"

# 错误处理
thiserror = "2.0"
anyhow = "1.0"

# 压缩包处理 (根据架构文档)
zip = "2.2"         # CBZ/ZIP 文件
unrar = "0.5"       # CBR/RAR 文件
sevenz-rust = "0.6" # CB7/7Z 文件

# PDF 处理
pdf-extract = "0.8"

# 图片处理
image = { version = "0.25", features = ["jpeg", "png", "gif", "webp"] }

# HTTP客户端
reqwest = { version = "0.12", features = ["json"] }

# OPDS支持
atom_syndication = "0.12"

# 环境变量
dotenvy = "0.15"

# 缓存
moka = { version = "0.12", features = ["future"] }

# 验证
validator = { version = "0.19", features = ["derive"] }

# 密码哈希
argon2 = "0.5"

# 随机数生成
rand = "0.8"

# Base64编码
base64 = "0.22"

# JWT 认证
jsonwebtoken = "9.3"

# 文件监控
notify = "6.1"

# Cron 表达式解析
cron = "0.12"

# 文件系统工具
walkdir = "2.5"

# MIME 类型检测
mime_guess = "2.0"

# 相似度计算
strsim = "0.10"

# 自然排序
natord = "1.0"

# 静态变量
lazy_static = "1.4"

# 插件系统 (libloading for dynamic loading)
libloading = "0.8"

# TOML 解析 (插件配置)
toml = "0.8.19"

# AI/ML 相关依赖（可选）
# ort = { version = "1.16", optional = true }  # ONNX Runtime
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }

# 异步特征支持
async-trait = "0.1"

# 加密哈希
sha2 = "0.10"

[features]
default = []
ai-local = ["candle-core", "candle-nn"]
# ai-onnx = ["ort"]
