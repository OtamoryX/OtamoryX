[package]
name = "otamoryx-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web框架
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "fs"] }

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid"] }

# 时间处理
chrono = { version = "0.4", features = ["serde"] }

# UUID生成
uuid = { version = "1.0", features = ["v4", "serde"] }

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }

# 配置管理
config = "0.14"

# 错误处理
thiserror = "1.0"
anyhow = "1.0"

# 压缩包处理 (根据架构文档)
zip = "0.6"                    # CBZ/ZIP 文件
unrar = "0.4"                  # CBR/RAR 文件
sevenz-rust = "0.5"            # CB7/7Z 文件

# PDF 处理
pdf-extract = "0.7"

# 图片处理
image = { version = "0.24", features = ["jpeg", "png", "gif", "webp"] }

# HTTP客户端
reqwest = { version = "0.11", features = ["json"] }

# OPDS支持
atom_syndication = "0.12"

# 环境变量
dotenvy = "0.15"

# 缓存
moka = { version = "0.12", features = ["future"] }

# 验证
validator = { version = "0.18", features = ["derive"] }

# 密码哈希
argon2 = "0.5"

# 随机数生成
rand = "0.8"

# Base64编码
base64 = "0.21"

# JWT 认证
jsonwebtoken = "9.0"

# 文件监控
notify = "6.0"

# Cron 表达式解析
cron = "0.12"

# 文件系统工具
walkdir = "2.4"

# MIME 类型检测
mime_guess = "2.0"

# 相似度计算
strsim = "0.10"

# 插件系统 (libloading for dynamic loading)
libloading = "0.8"

# TOML 解析 (插件配置)
toml = "0.8"

# AI/ML 相关依赖（可选）
# ort = { version = "1.16", optional = true }  # ONNX Runtime
candle-core = { version = "0.3", optional = true }
candle-nn = { version = "0.3", optional = true }

# 异步特征支持
async-trait = "0.1"

# 加密哈希
sha2 = "0.10"

[features]
default = []
ai-local = ["candle-core", "candle-nn"]
# ai-onnx = ["ort"]